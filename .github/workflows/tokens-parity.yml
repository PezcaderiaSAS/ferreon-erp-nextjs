name: Tokens Parity & Design System CI

# Automatización CI/CD de Paridad de Tokens de Diseño
# Proyecto: Alquileres System (FerreOn ERP & WMS)
# Spec:     SPEC-2026-FIGMA-DEVTOOLS-001 / Tarea 30

on:
  push:
    branches: ["main"]
    paths:
      - 'figma_design_tokens.json'
      - 'DESIGN.md'
      - 'tailwind.config.ts'
      - 'src/app/globals.css'
      - 'scripts/audit-tokens-parity.mjs'
      - '.github/workflows/tokens-parity.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'figma_design_tokens.json'
      - 'DESIGN.md'
      - 'tailwind.config.ts'
      - 'src/app/globals.css'
      - 'scripts/audit-tokens-parity.mjs'
      - '.github/workflows/tokens-parity.yml'
  workflow_dispatch:

concurrency:
  group: tokens-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-tokens:
    name: Validar Paridad W3C y Design System
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar Auditoría de Paridad Matemática
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: node scripts/audit-tokens-parity.mjs
